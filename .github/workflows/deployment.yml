name: Deployment
on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.20.0-alpha.11). Defaults to latest.
        required: false

env:
  ALUMNIUM_VERSION: ${{ github.event.release.tag_name || inputs.version }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: release
    environment:
      name: release
      url: https://alumnium.nocorp.dev
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - run: mise //websites/docs:install
      - run: mise //websites/docs:generate/install-scripts
      - run: mise //websites/docs:test/install-scripts
      - run: mise //websites/docs:build
      - uses: cloudflare/wrangler-action@v4
        id: deployment
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: bun
          workingDirectory: websites/docs
