name: Setup Maestro
description: Installs the Maestro CLI and boots a device for Maestro system tests.

inputs:
  platform:
    required: true
    description: Mobile platform to prepare a device for (ios, android).

  maestro-version:
    required: false
    default: 2.8.0
    description: Maestro CLI version to install.

  android-api-level:
    required: false
    default: "35"
    description: Android API level of the emulator to boot.

runs:
  using: composite
  steps:
    - name: Restore Maestro CLI Cache
      id: maestro-cache
      uses: actions/cache@v5
      with:
        path: ~/.maestro
        key: maestro-${{ runner.os }}-${{ inputs.maestro-version }}

    - name: Install Maestro CLI
      if: steps.maestro-cache.outputs.cache-hit != 'true'
      run: curl -Ls "https://get.maestro.mobile.dev" | bash
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.maestro-version }}

    - name: Add Maestro CLI to PATH
      run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      shell: bash

    # NOTE: iOS simulator is booted by tests/system/setup.maestro.ts using the
    # newest iPhone runtime available on the runner.

    - name: Enable KVM
      if: inputs.platform == 'android'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
      shell: bash

    - name: Install Android System Image
      if: inputs.platform == 'android'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "platform-tools" "emulator" "$SYSTEM_IMAGE" > /dev/null
      shell: bash
      env:
        SYSTEM_IMAGE: system-images;android-${{ inputs.android-api-level }};google_apis;x86_64

    - name: Restore AVD Cache
      if: inputs.platform == 'android'
      id: avd-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ runner.os }}-${{ inputs.android-api-level }}

    - name: Create AVD
      if: inputs.platform == 'android' && steps.avd-cache.outputs.cache-hit != 'true'
      run: |
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
          --force --name maestro --device pixel_6 --package "$SYSTEM_IMAGE"
      shell: bash
      env:
        SYSTEM_IMAGE: system-images;android-${{ inputs.android-api-level }};google_apis;x86_64

    - name: Boot Android Emulator
      if: inputs.platform == 'android'
      run: |
        ADB="$ANDROID_HOME/platform-tools/adb"
        LOG="$RUNNER_TEMP/emulator.log"
        nohup "$ANDROID_HOME/emulator/emulator" @maestro \
          -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none \
          > "$LOG" 2>&1 &
        if ! timeout 300 bash -c "until [ \"\$('$ADB' shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 5; done"; then
          echo "::error::Android emulator did not boot within 5 minutes"
          "$ADB" devices
          cat "$LOG"
          exit 1
        fi
        "$ADB" shell settings put global window_animation_scale 0
        "$ADB" shell settings put global transition_animation_scale 0
        "$ADB" shell settings put global animator_duration_scale 0
        "$ADB" devices
        tail -n 20 "$LOG"
      shell: bash
