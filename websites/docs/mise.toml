[tasks.install]
run = "bun install"

[tasks.clean]
run = "rm -rf dist/ public/install.sh public/install.ps1"

[tasks.check]
run = "bun run astro-check"

[tasks.build]
run = "bun run astro build"
depends = ["fetch/github"]

[tasks."dev:build"]
run = "fnox exec -- bun run astro preview"
depends = ["build"]

[tasks.dev]
run = "fnox exec -- bun run astro dev --host 0.0.0.0"

[tasks.deploy]
run = "fnox exec -- bun run wrangler deploy"
depends = ["check", "build"]

[tasks."deploy:dry-run"]
run = "bun run wrangler deploy --dry-run"
depends = ["build"]

[tasks."generate/install-scripts"]
run = "bun scripts/generate-install-scripts.ts"

[tasks."test/install-scripts"]
run = '''
sh public/install.sh
expected=$(mise //packages/typescript:version)
alumnium --version | grep -qF "$expected"
'''

[tasks."fetch/webvoyager"]
run = '''
curl https://raw.githubusercontent.com/steel-dev/leaderboard/refs/heads/main/src/data/webvoyager.json > \
  ./src/data/webvoyager.json
'''

[tasks."fetch/github"]
run = "bun scripts/fetchGitHubMetadata.ts"

[tasks."fetch/asciinema"]
run = "bun scripts/fetchAsciinemaMetadata.ts"

[tasks."gen/types"]
run = "bun wrangler types"

[tasks."version/set"]
description = "Sets the Alumnium version in the docs install snippets."
usage = '''
arg "<version>" help="Version to set, e.g. 0.24.0"
'''
run = "../../scripts/build/setVersion.ts docs {{usage.version}}"
